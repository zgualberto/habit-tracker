name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: continuous-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: habit_tracker
          POSTGRES_USER: habit_tracker
          POSTGRES_PASSWORD: habit_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habit_tracker -d habit_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://habit_tracker:habit_tracker@localhost:5432/habit_tracker?schema=public
      TEST_DATABASE_URL: postgresql://habit_tracker:habit_tracker@localhost:5432/habit_tracker_test?schema=public

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the shared contracts package
        run: npm run contracts:build

      - name: Generate the Prisma client
        run: npm run database:generate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test

      - name: Create the test database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE habit_tracker_test;'

      - name: Apply migrations to the test database
        run: npm run database:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run the API end-to-end suite
        run: npm run test:end-to-end

      - name: Build the applications
        run: npm run build
