server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The API and the client share an origin, so the httpOnly session cookie is
  # sent with every request and no CORS configuration is needed in production.
  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The service worker must never be cached, otherwise updates stall.
  location = /serviceWorker.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Hashed assets are safe to cache forever.
  location ~* \.(?:js|css|svg|png|ico|woff2)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single page application fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
